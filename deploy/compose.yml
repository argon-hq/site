# Três ambientes na mesma instância: prod, dev e lab (branches em desenvolvimento). Tags em /opt/argon/.env (PROD_TAG, DEV_TAG, LAB_TAG).
#
# Images are pinned to a minor: a `2-alpine` that becomes the next minor on a pull is a surprise on
# the box that serves production. Bumping is a one-line PR. node is pinned the same way in the Dockerfiles.

# `up --wait` in deploy.sh only fails on a broken container because of these. The API answers on
# /health/live, which does not query the database: polled every 30 s, a query would keep Neon from
# suspending. The database is proven by the smoke test on /health after the deploy; the site just
# has to render its home page.
# Busybox wget comes with the alpine base image. start_period covers a cold Nest boot.
x-api-healthcheck: &api-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/health/live || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 40s
x-web-healthcheck: &web-healthcheck
  test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 40s

# Non-blocking: with the default mode a CloudWatch outage stalls the container on its next log line
# (or keeps it from starting). 4 MB of buffer absorbs the gap; beyond that lines are dropped, which
# beats a frozen API. The group name is per service.
x-awslogs: &awslogs
  awslogs-region: sa-east-1
  awslogs-create-group: "true"
  mode: non-blocking
  max-buffer-size: 4m

services:
  caddy:
    image: caddy:2.11-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    # STUDIO_AUTH_USER and STUDIO_AUTH_HASH for the Caddyfile's basic_auth; deploy.sh writes the file.
    env_file: env/caddy.env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./logs:/var/log/caddy
      - caddy-data:/data
      - caddy-config:/config
    # Access logs of the production hosts go to stdout as JSON, hence here.
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/caddy } }

  # init: node as PID 1 does not reap children nor forward signals the way the kernel expects; tini
  # does, so `compose stop` ends the process instead of waiting for the kill.
  web-prod:
    image: ${ECR}/argon/web:${PROD_TAG}
    restart: unless-stopped
    init: true
    # Only what the site reads (API_URL, INTERNAL_API_SECRET, ARGON_ENV): the API keys stay with the API.
    env_file: env/prod.web.env
    oom_score_adj: -800
    healthcheck: *web-healthcheck
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/prod/web } }

  api-prod:
    image: ${ECR}/argon/api:${PROD_TAG}
    restart: unless-stopped
    init: true
    env_file: env/prod.env
    oom_score_adj: -800
    healthcheck: *api-healthcheck
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/prod/api } }

  # Dev and lab are capped so that a live run there — the model, the pages it reads — cannot push
  # the instance into killing prod. 512 MB is twice what the API idles at; the site needs less.
  web-dev:
    image: ${ECR}/argon/web:${DEV_TAG}
    restart: unless-stopped
    init: true
    env_file: env/dev.web.env
    mem_limit: 256m
    healthcheck: *web-healthcheck
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/dev/web } }

  api-dev:
    image: ${ECR}/argon/api:${DEV_TAG}
    restart: unless-stopped
    init: true
    env_file: env/dev.env
    mem_limit: 512m
    healthcheck: *api-healthcheck
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/dev/api } }

  web-lab:
    image: ${ECR}/argon/web:${LAB_TAG}
    restart: unless-stopped
    init: true
    env_file: env/lab.web.env
    mem_limit: 256m
    healthcheck: *web-healthcheck
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/lab/web } }

  api-lab:
    image: ${ECR}/argon/api:${LAB_TAG}
    restart: unless-stopped
    init: true
    env_file: env/lab.env
    mem_limit: 512m
    healthcheck: *api-healthcheck
    logging: { driver: awslogs, options: { <<: *awslogs, awslogs-group: /argon/lab/api } }

volumes:
  caddy-data:
  caddy-config:
