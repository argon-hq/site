# Weekly, so the pins in the workflows and the API's Dockerfile do not quietly age.
# Majors of next and react are not taken automatically: each one is a migration, not an update.
# PRs go to dev, like any other change; main only gets what dev promotes.
# @types/node and the node image follow the Node runtime (22), so their majors wait for a runtime upgrade.
# Majors of effect (4 is a rewrite) and eslint (the web's eslint-config-next is not on 10 yet) wait
# for their own card. The @nestjs packages move a major together, never one at a time.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
  - package-ecosystem: docker
    directory: /apps/api
    schedule: { interval: weekly }
    target-branch: dev
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    target-branch: dev
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      nestjs-major:
        patterns: ["@nestjs/*"]
        update-types: [major]
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: effect
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
