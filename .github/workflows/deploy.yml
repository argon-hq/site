name: Deploy
on:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      env:
        description: "Ambiente"
        type: choice
        options: [lab, dev, prod]
        default: lab
      branch:
        description: "Branch a publicar (lab). Vazio usa a branch deste workflow"
        type: string
        default: ""
      tag:
        description: "Tag já publicada no ECR (12 caracteres do SHA); pula o build e publica essa imagem"
        type: string
        default: ""
permissions:
  id-token: write
  contents: read
env:
  AWS_REGION: sa-east-1
  ENV_NAME: ${{ inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
# Um deploy por ambiente de cada vez; o seguinte espera.
concurrency:
  group: deploy-${{ inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
jobs:
  deploy:
    runs-on: ubuntu-24.04-arm
    environment: ${{ inputs.env || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      # Only the lab publishes an arbitrary branch. Dev and prod come from their own branches, and a
      # dispatch that says otherwise is a mistake, not a request.
      - name: Recusa branch fora do lab
        if: inputs.branch != '' && (inputs.env != 'lab' || inputs.tag != '')
        env:
          BRANCH: ${{ inputs.branch }}
        run: |
          echo "deploy: branch=$BRANCH only makes sense for env=lab and without tag, not $ENV_NAME" >&2
          exit 1
      # O workflow e o Terraform dos arquivos públicos vêm da branch em que ele roda. Full history,
      # so the commit before this push is there to diff against.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # O código publicado pode vir de outra branch: é o caso do lab.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.branch != ''
        with:
          ref: ${{ inputs.branch }}
          path: src
      # A given tag is a rollback: the image is already in ECR, so nothing is built (deploy/README.md).
      - id: src
        env:
          BRANCH: ${{ inputs.branch }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          DIR=.; [ -n "$BRANCH" ] && DIR=src
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -n "$INPUT_TAG" ]; then
            [[ "$INPUT_TAG" =~ ^[0-9a-f]{12}$ ]] || { echo "deploy: tag must be the 12-character commit sha" >&2; exit 1; }
            echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "tag=$(git -C "$DIR" rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      # Whether to build the API image. A push builds it only when its commits touched the app or
      # the workspace files the image copies. A dispatch, a first push (before is all zeros), a base
      # that is gone, or no image yet for this environment build it.
      - id: changes
        if: inputs.tag == ''
        env:
          BEFORE: ${{ github.event.before }}
          EVENT: ${{ github.event_name }}
        run: |
          build="api"; skipped=""
          if [ "$EVENT" = push ] && [ -n "$BEFORE" ] && ! [[ "$BEFORE" =~ ^0+$ ]] && git cat-file -e "$BEFORE" 2>/dev/null; then
            if [ -z "$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- apps/api pnpm-lock.yaml package.json pnpm-workspace.yaml turbo.json)" ] \
              && aws ecr describe-images --repository-name argon/api --image-ids "imageTag=$ENV_NAME" >/dev/null 2>&1; then
              build=""; skipped="api"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "skipped=$skipped" >> "$GITHUB_OUTPUT"
          echo "build: [$build] skipped: [$skipped]"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: inputs.tag == ''
      # Layer cache in the Actions cache: a push that only touches the code reuses the pnpm install
      # layers. provenance off keeps the ECR image a plain manifest, which the retag below copies as
      # is.
      # The site's browser code calls the API directly, so its origin, and the site's own, are baked
      # in when the static site is built (below).
      - name: Origens do ambiente
        id: origins
        if: inputs.tag == ''
        run: |
          echo "web=$(aws ssm get-parameter --name "/argon/$ENV_NAME/WEB_ORIGIN" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
          echo "api=$(aws ssm get-parameter --name "/argon/$ENV_NAME/API_ORIGIN" --query Parameter.Value --output text)" >> "$GITHUB_OUTPUT"
      - name: Build e push api
        if: inputs.tag == '' && contains(steps.changes.outputs.build, 'api')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.src.outputs.dir }}
          file: ${{ steps.src.outputs.dir }}/apps/api/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: |
            ${{ steps.ecr.outputs.registry }}/argon/api:${{ steps.src.outputs.tag }}
            ${{ steps.ecr.outputs.registry }}/argon/api:${{ env.ENV_NAME }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      # The functions move to this commit's tag, and a rollback names a tag: an API that was not
      # rebuilt gets its current image tagged with this commit too. A manifest copy inside ECR,
      # nothing is pulled.
      - name: Marca a imagem do app sem mudança
        if: inputs.tag == '' && steps.changes.outputs.skipped != ''
        env:
          SKIPPED: ${{ steps.changes.outputs.skipped }}
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          for app in $SKIPPED; do
            if aws ecr describe-images --repository-name "argon/$app" --image-ids "imageTag=$TAG" >/dev/null 2>&1; then
              echo "argon/$app:$TAG already exists"; continue
            fi
            MANIFEST=$(aws ecr batch-get-image --repository-name "argon/$app" --image-ids "imageTag=$ENV_NAME" --query 'images[0].imageManifest' --output text)
            TYPE=$(aws ecr batch-get-image --repository-name "argon/$app" --image-ids "imageTag=$ENV_NAME" --query 'images[0].imageManifestMediaType' --output text)
            aws ecr put-image --repository-name "argon/$app" --image-tag "$TAG" --image-manifest "$MANIFEST" --image-manifest-media-type "$TYPE" >/dev/null
            echo "argon/$app:$ENV_NAME -> argon/$app:$TAG"
          done
      # apps/web/public goes to the public bucket under <env>/ (deploy/aws/public-assets), before the
      # functions move: the e-mails of the API about to run read their images from there.
      # Every deploy runs it: Terraform compares each file's MD5 with its state, so an unchanged
      # folder uploads nothing, and an environment whose prefix is still empty gets filled. A
      # rollback (tag) skips it: the checkout is not that tag's code.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: inputs.tag == ''
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false
      - name: Arquivos públicos
        if: inputs.tag == ''
        env:
          SRC_DIR: ${{ steps.src.outputs.dir }}
        run: |
          terraform -chdir=deploy/aws/public-assets init -input=false -backend-config="key=public-assets/$ENV_NAME.tfstate"
          terraform -chdir=deploy/aws/public-assets apply -input=false -auto-approve \
            -var "env=$ENV_NAME" -var "public_dir=$GITHUB_WORKSPACE/$SRC_DIR/apps/web/public"
      # The environment's Lambda functions (deploy/aws/lambda.tf) run the API image: the jobs function
      # moves to the tag first and applies the migrations from it (src/pipeline/migrate.ts), as
      # the EC2's deploy script did before a new container started; only then does the API function
      # move, so no code runs against an older schema. The job answers {"done":true}, or an error
      # that stops the deploy here. An environment without functions skips it.
      - name: Funções Lambda
        env:
          TAG: ${{ steps.src.outputs.tag }}
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          for f in "argon-$ENV_NAME-jobs" "argon-$ENV_NAME-api"; do
            if ! aws lambda get-function-configuration --function-name "$f" >/dev/null 2>&1; then
              echo "$f does not exist, skipped"; continue
            fi
            aws lambda update-function-code --function-name "$f" --image-uri "$REGISTRY/argon/api:$TAG" \
              --query '[FunctionName,LastUpdateStatus]' --output text
            aws lambda wait function-updated --function-name "$f"
            if [ "$f" = "argon-$ENV_NAME-jobs" ]; then
              aws lambda invoke --function-name "$f" --payload '{"job":"migrate"}' --cli-binary-format raw-in-base64-out \
                --cli-read-timeout 900 migrate.json --query FunctionError --output text
              cat migrate.json; echo
              jq -e '.done == true' migrate.json >/dev/null || { echo "deploy: migrations failed, the API stays where it was" >&2; exit 1; }
            fi
          done
      # The environment's tag names the image it runs: a push that does not touch the API deploys a
      # copy of it, and the lifecycle policy never expires it. After a rollback it must name the
      # rolled-back image, or the next such push would quietly bring back the one rolled away from.
      - name: Tag do ambiente no rollback
        if: inputs.tag != ''
        env:
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          MANIFEST=$(aws ecr batch-get-image --repository-name argon/api --image-ids "imageTag=$TAG" --query 'images[0].imageManifest' --output text)
          TYPE=$(aws ecr batch-get-image --repository-name argon/api --image-ids "imageTag=$TAG" --query 'images[0].imageManifestMediaType' --output text)
          if ! OUT=$(aws ecr put-image --repository-name argon/api --image-tag "$ENV_NAME" --image-manifest "$MANIFEST" --image-manifest-media-type "$TYPE" 2>&1 >/dev/null); then
            # The tag already names this image: nothing to move.
            echo "$OUT" | grep -q ImageAlreadyExistsException || { echo "$OUT" >&2; exit 1; }
          fi
          echo "argon/api:$TAG -> argon/api:$ENV_NAME"
      # The static site (deploy/aws/site_cdn.tf): built with this environment's origins, synced to its
      # folder in the site bucket, and the distribution invalidated. An environment whose distribution
      # does not exist yet skips it.
      - name: Site estático, distribuição
        id: site
        if: inputs.tag == ''
        run: |
          ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Comment=='argon $ENV_NAME site'].Id | [0]" --output text)
          [ "$ID" = None ] && ID=""
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          [ -n "$ID" ] || echo "no site distribution for $ENV_NAME, skipped"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: steps.site.outputs.id != ''
        with:
          package_json_file: ${{ steps.src.outputs.dir }}/package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.site.outputs.id != ''
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ${{ steps.src.outputs.dir }}/pnpm-lock.yaml
      - name: Site estático
        if: steps.site.outputs.id != ''
        env:
          SRC_DIR: ${{ steps.src.outputs.dir }}
          DIST_ID: ${{ steps.site.outputs.id }}
          WEB_ORIGIN: ${{ steps.origins.outputs.web }}
          API_ORIGIN: ${{ steps.origins.outputs.api }}
        run: |
          # The origins are the environment's own, baked into the files: the sitemap, the metadata,
          # and the API the browser calls.
          BUCKET="argon-site-$(aws sts get-caller-identity --query Account --output text)"
          cd "$SRC_DIR"
          pnpm install --frozen-lockfile --filter web...
          WEB_ORIGIN="$WEB_ORIGIN" NEXT_PUBLIC_API_ORIGIN="$API_ORIGIN" pnpm --filter web build
          aws s3 sync apps/web/out "s3://$BUCKET/$ENV_NAME/" --delete --only-show-errors
          # The Open Graph image has no extension, so sync stores it as octet-stream: a link preview
          # needs image/png.
          aws s3 cp apps/web/out "s3://$BUCKET/$ENV_NAME/" --recursive --exclude '*' --include '*/opengraph-image' \
            --content-type image/png --metadata-directive REPLACE --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths '/*' --query Invalidation.Id --output text
      # The function answering is not the same as the API answering from the internet: this also
      # covers CloudFront, DNS and the certificate.
      - name: Smoke
        run: |
          case "$ENV_NAME" in
            prod) HOST=api.argonbusiness.com ;;
            *) HOST="api.$ENV_NAME.argonbusiness.com" ;;
          esac
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors "https://$HOST/health"
      # A red run only reaches whoever is watching the Actions tab; the SNS topic reaches a phone.
      # Without the secret the step just says so — a missing alert must not hide the real failure.
      - name: Alerta de falha
        if: failure()
        env:
          TOPIC_ARN: ${{ secrets.AWS_ALERTS_TOPIC_ARN }}
        run: |
          [ -n "$TOPIC_ARN" ] || { echo "deploy: AWS_ALERTS_TOPIC_ARN is not set, no alert sent"; exit 0; }
          aws sns publish --topic-arn "$TOPIC_ARN" --subject "deploy $ENV_NAME failed" \
            --message "Deploy $ENV_NAME failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
