name: CI
on:
  pull_request:
  push:
    branches: [dev, main]
permissions:
  contents: read
# A newer push to the same branch or PR supersedes the run still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check-types
      # Some things only break at build time — a route, a server/client boundary, the Nest bundle.
      - run: pnpm build
      - run: pnpm test
      # Coverage floor on the pipeline, the mail and the subscriber code: it fails when a module
      # loses its tests, which is the one thing a coverage number is good at saying.
      - run: pnpm -C apps/api test:coverage
      # Informational: the result is in the log, and the fix is a Dependabot PR or an override in
      # pnpm-workspace.yaml, not a blocked CI.
      - name: pnpm audit
        run: pnpm audit --prod --audit-level high || true
