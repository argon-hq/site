# Local Postgres for development, same major version and extensions as the RDS instance.
#   pnpm db:up    →  postgresql://argon:argon@localhost:5432/argon_dev
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: argon
      POSTGRES_PASSWORD: argon
      POSTGRES_DB: argon_dev
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argon -d argon_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db-data:
