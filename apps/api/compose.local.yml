# Local dependencies for development: Postgres, the same image as the one deployed on the instance
# (deploy/compose.yml), and Mailpit, which accepts every message and delivers none.
#   pnpm db:up    →  postgresql://argon:argon@localhost:5432/argon_dev
#                 →  smtp://localhost:1025, inbox at http://localhost:8025
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    ports: ["5432:5432"]
    environment:
      POSTGRES_USER: argon
      POSTGRES_PASSWORD: argon
      POSTGRES_DB: argon_dev
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argon -d argon_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every e-mail the API sends in development. Nothing leaves the machine, so a wrong
  # address in a fixture cannot reach a real person.
  mail:
    image: axllent/mailpit:v1.28
    restart: unless-stopped
    ports: ["1025:1025", "8025:8025"]
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db-data:
